<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع السيرة الذاتية - Apex Matrix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg-page: #dfe4ea;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-page);
            margin: 0;
            display: flex;
        }

        /* لوحة الإدخال */
        .input-panel {
            width: 450px;
            background: #fff;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
        }

        .input-panel h2 { color: var(--primary); font-size: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }

        .group { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #eee; }
        .group h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--accent); }

        label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        input, textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box;
        }

        .btn-save {
            background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        /* ورقة المعاينة */
        .preview-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            background: #57606f;
            overflow-y: auto;
        }

        #cv-sheet {
            width: 210mm;
            min-height: 297mm;
            background: #fff;
            display: flex;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* تصميم السي في */
        .side {
            width: 30%;
            background: var(--primary);
            color: white;
            padding: 30px 15px;
        }

        #pic-holder {
            width: 120px; height: 120px; border-radius: 10%; border: 2px solid var(--accent);
            margin: 0 auto 20px; background: #444; overflow: hidden;
        }
        #pic-holder img { width: 100%; height: 100%; object-fit: cover; }

        .side-sec { margin-bottom: 25px; }
        .side-sec-title { color: var(--accent); font-size: 13px; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; }
        .side-text { font-size: 13px; line-height: 1.6; word-break: break-all; }

        .main { width: 70%; padding: 40px; color: #2d3436; }
        .name-big { font-size: 35px; font-weight: 800; margin: 0; color: var(--primary); }
        .title-sub { font-size: 18px; color: var(--accent); margin-bottom: 30px; }

        .main-sec { margin-bottom: 30px; }
        .main-sec-title { 
            font-size: 16px; font-weight: bold; color: var(--primary); 
            border-right: 4px solid var(--accent); padding-right: 10px; margin-bottom: 15px;
        }
        .main-text { font-size: 14px; line-height: 1.7; white-space: pre-line; color: #444; }

    </style>
</head>
<body>

    <div class="input-panel">
        <h2>بيانات السيرة الذاتية</h2>
        
        <div class="group">
            <input type="checkbox" id="checkPic" checked onchange="togglePic()"> إظهار الصورة الشخصية
            <input type="file" onchange="readImg(event)">
        </div>

        <div class="group">
            <h4>الهوية</h4>
            <input type="text" placeholder="الاسم الكامل" oninput="out('oName', this.value)">
            <input type="text" placeholder="المسمى الوظيفي" oninput="out('oJob', this.value)">
        </div>

        <div class="group">
            <h4>التواصل</h4>
            <input type="text" placeholder="البريد الإلكتروني" oninput="out('oMail', this.value)">
            <input type="text" placeholder="رقم الهاتف" oninput="out('oPhone', this.value)">
            <input type="text" placeholder="رابط (LinkedIn/GitHub)" oninput="out('oLink', this.value)">
            <input type="text" placeholder="العنوان" oninput="out('oLoc', this.value)">
        </div>

        <div class="group">
            <h4>الأقسام الرئيسية</h4>
            <label>نبذة شخصية</label>
            <textarea rows="4" placeholder="اكتب نبذة تعبر عنك..." oninput="out('oAbout', this.value)"></textarea>
            
            <label>الخبرة والمشاريع</label>
            <textarea rows="6" placeholder="اكتب خبراتك العملية ومشاريعك بأسلوبك..." oninput="out('oExp', this.value)"></textarea>
            
            <label>التعليم</label>
            <textarea rows="4" placeholder="المؤهلات الدراسية..." oninput="out('oEdu', this.value)"></textarea>
        </div>

        <div class="group">
            <h4>مهارات ولغات</h4>
            <label>المهارات (افصل بينها بفاصلة)</label>
            <textarea rows="3" oninput="out('oSkills', this.value)"></textarea>
            <label>اللغات</label>
            <input type="text" oninput="out('oLang', this.value)">
        </div>

        <button class="btn-save" onclick="generate()">حفظ بصيغة PDF</button>
    </div>

    <div class="preview-panel">
        <div id="cv-sheet">
            <!-- Sidebar -->
            <div class="side">
                <div id="pic-holder"><img id="previewPic" src=""></div>
                
                <div class="side-sec">
                    <div class="side-sec-title">تواصل</div>
                    <div class="side-text">
                        <div id="oMail"></div>
                        <div id="oPhone"></div>
                        <div id="oLink"></div>
                        <div id="oLoc"></div>
                    </div>
                </div>

                <div class="side-sec">
                    <div class="side-sec-title">المهارات</div>
                    <div class="side-text" id="oSkills"></div>
                </div>

                <div class="side-sec">
                    <div class="side-title">اللغات</div>
                    <div class="side-text" id="oLang"></div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main">
                <h1 class="name-big" id="oName">الاسم الكامل</h1>
                <div class="title-sub" id="oJob">المسمى الوظيفي</div>

                <div class="main-sec">
                    <div class="main-sec-title">البروفايل الشخصي</div>
                    <div class="main-text" id="oAbout"></div>
                </div>

                <div class="main-sec">
                    <div class="main-sec-title">الخبرة المهنية</div>
                    <div class="main-text" id="oExp"></div>
                </div>

                <div class="main-sec">
                    <div class="main-sec-title">المؤهلات التعليمية</div>
                    <div class="main-text" id="oEdu"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // دالة عرض النصوص
        function out(id, val) {
            document.getElementById(id).innerText = val;
        }

        // إخفاء وإظهار الصورة
        function togglePic() {
            const box = document.getElementById('pic-holder');
            box.style.display = document.getElementById('checkPic').checked ? 'block' : 'none';
        }

        // قراءة الصورة
        function readImg(e) {
            const reader = new FileReader();
            reader.onload = () => document.getElementById('previewPic').src = reader.result;
            reader.readAsDataURL(e.target.files[0]);
        }

        // توليد PDF
        function generate() {
            const element = document.getElementById('cv-sheet');
            html2pdf().set({
                margin: 0,
                filename: 'My_CV.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save();
        }
    </script>
</body>
</html>
